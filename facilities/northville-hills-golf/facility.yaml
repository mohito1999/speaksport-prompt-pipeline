booking_rules:
- All players can book tee times up to fourteen calendar days in advance, inclusive of the fourteenth future date.
- Bookings require a minimum of 2 players; single-player bookings are not permitted.
- Bookings require the customer to have a card on file (`customer_has_card_on_file`), UNLESS the active labels in `customer_passes` semantically identify a Northville Card, Northville Pass, Northville Member Card, or equivalent Northville-designated pass.
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
cancellation_modification_policy: The AI may cancel a reservation only when the tee time is at least 24 hours after the facility-local current date and time. If hours until tee off is less than 24, the exact denial reason is "Cancellations must be made at least 24 hours before the tee time. Cancellations within 24 hours may be subject to a no-show fee. Please contact the Golf Shop for assistance." If hours until tee off is exactly 24 or greater, the exact eligible reason is "Eligible for cancellation." Do not apply any other cancellation restrictions.
