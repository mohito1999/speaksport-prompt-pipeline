booking_rules:
  - >-
    If the requested booking date is before the facility-local current date,
    the caller is not eligible. Exact reason: "That date has already passed."

  - >-
    Players can book tee times up to fourteen calendar days in advance.
    The fourteenth future calendar date is eligible.

  - >-
    If the requested booking date is more than fourteen calendar days after
    the facility-local current date, the caller is not eligible. Exact reason:
    "Tee times may be booked up to 14 calendar days in advance, including the
    fourteenth future date."

  - >-
    A minimum of 2 players is required, so player count must be collected and
    passed to booking eligibility.

  - >-
    If the requested player count is fewer than 2, the caller is not eligible.
    Exact reason: "A minimum of 2 players is required to book a tee time."

  - >-
    Do not apply any other eligibility restrictions based on memberships,
    passes, groups, price classes, card-on-file status, course, day of week,
    time of day, or any other criteria.

  - >-
    If none of the approved rules makes the caller ineligible, the caller is
    eligible. Exact reason: "Eligible to book."

  - Both nine-hole and eighteen-hole tee times are supported.

  - >-
    This is a single-course facility; omit course and course_name filters from
    availability searches.

  - >-
    When booking, preserve and pass the exact course returned with the selected
    availability slot.

cancellation_modification_policy: >-
  The AI may cancel a reservation only when the tee time is at least 24 hours
  after the facility-local current date and time. If hours until tee off is
  less than 24, the reservation is not eligible for cancellation. Exact reason:
  "Cancellations must be made at least 24 hours before the tee time.
  Cancellations within 24 hours are subject to a no-show fee. Please contact
  the Pro Shop for assistance." If hours until tee off is exactly 24 or greater,
  the reservation is eligible. Exact reason: "Eligible for cancellation."
  Do not apply any other cancellation restrictions based on number of players,
  course, passes, card-on-file status, groups, price class, day of week,
  time of day, or any other criteria. Booking modifications and rescheduling
  cannot be completed by the AI and must use the normal two-step Pro Shop
  transfer process.

