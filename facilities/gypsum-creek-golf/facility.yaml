booking_rules:
- Players can book tee times up to fourteen calendar days in advance, inclusive of the fourteenth future date.
- For groups larger than eight players, transfer the caller to the Club House immediately.
- For bookings of 5 to 8 players, book consecutive tee times (e.g., 6 players is split into a foursome and a twosome; 8 players is split into two foursomes).
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
