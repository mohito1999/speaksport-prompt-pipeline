      Restaurant hours, dining questions, reservations, and food and beverage
      inquiries.
    display_name: Restaurant

  - identifier: business_office
    responsibility: >-
      Billing, administrative, account, and business-office inquiries.
    display_name: Business Office

booking_rules:
  - >-
    If the requested booking date is before the facility-local current date,
    the caller is not eligible. Exact reason: "That date has already passed."

  - >-
    Tee times may be booked up to 10 calendar days in advance. The tenth future
    calendar date is eligible.

  - >-
    If the requested booking date is more than 10 calendar days after the
    facility-local current date, the caller is not eligible. Exact reason:
    "Tee times may be booked up to 10 calendar days in advance, including the
    tenth future date."

  - >-
    Do not apply any other eligibility restrictions based on memberships,
    passes, groups, price classes, card-on-file status, player count, course,
    day of week, time of day, or any other criteria.

  - >-
    If none of the approved rules makes the caller ineligible, the caller is
    eligible. Exact reason: "Eligible to book."

  - Both nine-hole and eighteen-hole tee times are supported.

  - >-
    This is a single-course facility; omit course and course_name filters from
    availability searches.

  - >-
    When booking, preserve and pass the exact course returned with the selected
    availability slot.

cancellation_modification_policy: >-
  Geneva Farm uses Club Prophet. Its booking references are numeric values such
  as 366135, not ForeUp references. Never add, restore, expect, or request a
  TTID_ prefix. For a fallback booking lookup and for cancellation, preserve and
  pass the exact numeric booking reference returned by the tool or supplied by
  the caller. The AI may cancel a reservation only when the tee time is at least
  24 hours after the facility-local current date and time. If hours until tee
  off is less than 24, the reservation is not eligible for cancellation. Exact
  reason: "I can only process cancellations for tee times that are at least 24
  hours from now. The Pro Shop can help you with this cancellation." If hours
  until tee off is exactly 24 or greater than 24, the reservation is eligible.
  Exact reason: "Eligible for cancellation." Do not apply any other
  cancellation restrictions based on number of players, course, passes,
  card-on-file status, groups, price class, day of week, time of day, or any
  other criteria. Booking modifications and rescheduling cannot be completed by
  the AI and must use the normal two-step Pro Shop transfer process. After a
  successful cancellation, tell the caller that if the tee time was prepaid and
  is eligible for a refund, the Pro Shop can process the refund. Ask whether the
  caller would like a transfer to the Pro Shop and use the normal two-step
  transfer process if they agree.

walking_riding_cart_policies: []

