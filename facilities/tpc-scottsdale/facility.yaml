booking_rules: []
cancellation_modification_policy: >-
  This is a non-integrated, SMS-only flow. The assistant cannot directly check,
  modify, reschedule, or cancel tee-time reservations. For existing tee-time
  assistance, first determine whether the reservation concerns the Stadium
  Course or Champions Course, then offer the corresponding Stadium Shop or
  Champions Shop transfer under the normal two-step transfer protocol.
