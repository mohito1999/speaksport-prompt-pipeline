booking_rules:
- Residents with an active Recreation ID Card can book tee times up to fourteen calendar days in advance, inclusive of the fourteenth future date.
- Residents without a Recreation ID Card and non-residents can book tee times up to seven calendar days in advance, inclusive of the seventh future date.
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
cancellation_modification_policy: Cancellations are required 24 hours in advance of a tee time to avoid a Cancellation Fee. Arriving with fewer players than booked incurs a No Show Fee per person. No Show and Cancellation Fees are not charged during inclement weather.
walking_riding_cart_policies:
- Early Bird Special & Super Twilight times require golf carts.
- Single riders will be paired together prior to teeing off.
