booking_rules:
- Public players can book tee times 1 to 7 days in advance with no extra fee.
- Public players booking 8 to 90 days in advance incur a $30 non-refundable fee per player; prompt must confirm caller acceptance before proceeding.
- Platinum and Weekday Hybrid Members can book up to 14 days in advance.
- Gold and Twilight Hybrid Members can book up to 12 days in advance.
- Silver, Weekday, and Twilight Members can book up to 10 days in advance.
- Junior Members can only book under junior member benefits up to 24 hours in advance.
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
