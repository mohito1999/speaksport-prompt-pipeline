booking_rules:
- Daily fee players can book tee times up to fourteen calendar days in advance, inclusive of the fourteenth future date.
- Members (identified via price_class) can book tee times up to twenty-one calendar days in advance, inclusive of the twenty-first future date.
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
