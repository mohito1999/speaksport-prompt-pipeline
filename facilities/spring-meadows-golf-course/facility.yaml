schema_version: '1'
slug: spring-meadows-golf-course
display_name: Spring Meadows Golf Course
website_url: https://www.springmeadowsgolf.com/
timezone: America/New_York
integration_type: integrated
course_configuration: single_course
exact_course_values: []

references:
  prompt: '2026-07-10'
  eligibility: '2026-07-10'

enabled_tools:
  - check-booking-eligibility-staging
  - get-available-tee-times-staging
  - book-tee-time-staging
  - transfer_call-staging
  - get-day-of-week-staging
  - fetch-inventory-for-date
  - get-weather-forecast-staging
  - get-bookings
  - get-eligibility-for-cancellation
  - cancel-reservation

greeting: ''
disclaimer: ''
announcement: ''
booking_url: null

transfer_destinations:
  - identifier: pro_shop
    responsibility: >-
      Tee-time assistance, booking modifications and rescheduling,
      cancellations that the AI cannot process, prepaid cancellation refunds,
      course conditions, cart-policy questions, and general golf operations.
    display_name: Pro Shop

  - identifier: golf_events
    responsibility: >-
      Golf leagues, group outings, tournaments, scrambles, and other golf
      events.
    display_name: Golf Events

  - identifier: wedding_banquet_events
    responsibility: >-
      Weddings, banquets, receptions, private functions, venue rentals, and
      non-golf event planning.
    display_name: Wedding and Banquet Events

booking_rules:
  - >-
    If the requested booking date is before the facility-local current date,
    the caller is not eligible. Exact reason: "That date has already passed."

  - >-
    Tee times may be booked up to 14 calendar days in advance. The fourteenth
    future calendar date is eligible.

  - >-
    If the requested booking date is more than 14 calendar days after the
    facility-local current date, the caller is not eligible. Exact reason:
    "Tee times may be booked up to 14 calendar days in advance, including the
    fourteenth future date."

  - >-
    Do not apply any other eligibility restrictions based on memberships,
    passes, groups, price classes, card-on-file status, player count, course,
    day of week, time of day, or any other criteria.

  - >-
    If none of the approved rules makes the caller ineligible, the caller is
    eligible. Exact reason: "Eligible to book."

  - Both nine-hole and eighteen-hole tee times are supported.

  - >-
    This is a single-course facility; omit course and course_name filters from
    availability searches.

  - >-
    When booking, preserve and pass the exact course returned with the selected
    availability slot.

cancellation_modification_policy: >-
  Spring Meadows uses Club Prophet. Its booking references are numeric values
  such as 366135, not ForeUp references. Never add, restore, expect, or request
  a TTID_ prefix. For a fallback booking lookup and for cancellation, preserve
  and pass the exact numeric booking reference returned by the tool or supplied
  by the caller. The AI may cancel a reservation only when the tee time is at
  least 24 hours after the facility-local current date and time. If hours until
  tee off is less than 24, the reservation is not eligible for cancellation.
  Exact reason: "I can only process cancellations for tee times that are at
  least 24 hours from now. The Pro Shop can help you with this cancellation."
  If hours until tee off is exactly 24 or greater than 24, the reservation is
  eligible. Exact reason: "Eligible for cancellation." Do not apply any other
  cancellation restrictions based on number of players, course, passes,
  card-on-file status, groups, price class, day of week, time of day, or any
  other criteria. Booking modifications and rescheduling cannot be completed by
  the AI and must use the normal two-step Pro Shop transfer process. After a
  successful cancellation, tell the caller that if the tee time was prepaid and
  is eligible for a refund, the Pro Shop can process the refund. Ask whether the
  caller would like a transfer to the Pro Shop and use the normal two-step
  transfer process if they agree.

walking_riding_cart_policies:
  - >-
    Golf carts are unavailable for tee times within two hours of sunset. Those
    tee times are walking only.
  - >-
    This cart restriction is not a booking-eligibility rule. If a selected tee
    time is known to be within two hours of sunset, explain the walking-only
    restriction and record riding as false only after the caller agrees to walk.
    If the caller needs a cart, offer to search for an earlier tee time.

caller_details:
  first_name: true
  last_name: true
  email: true
  confirm_existing_email: true

allowed_source_urls:
  - https://www.springmeadowsgolf.com/

excluded_source_paths: []
crawl_entire_domain: false
allow_subdomains: false
ignored_facts: []
reference_leakage_exceptions: []
