booking_rules:
- >-
  If the requested date is before the facility-local current date, the caller
  is not eligible. Exact reason: "The requested date has already passed. Please
  choose a future date."
- >-
  Classify the caller as a Member if at least one customer_passes record has
  expired set to false, or if any customer_groups value semantically equals
  "member" case-insensitively. Otherwise classify the caller as a Public Player
  (Non-Member).
- >-
  Members have a 14-day booking window inclusive of the current date. The
  latest eligible date is the facility-local current date plus 13 calendar
  days. A later date is ineligible. Exact reason: "Members can only book up to
  14 days in advance (including today). Please choose a date on or before the
  latest available booking date."
- >-
  Public Players have a 7-day booking window inclusive of the current date.
  The latest eligible date is the facility-local current date plus 6 calendar
  days. A later date is ineligible. Exact reason: "Public players can only book
  up to 7 days in advance (including today). Please choose a date on or before
  the latest available booking date."
- >-
  If none of the approved rules makes the caller ineligible, the caller is
  eligible. Exact reason: "Eligibility confirmed."
- >-
  Eligibility receives only date in YYYY-MM-DD and the approximate requested
  time in 24-hour HH:MM. Do not pass players, holes, riding preference,
  identity fields, or course_name.
- Both nine-hole and eighteen-hole tee times are supported.
- >-
  This is a single-course facility. Do not ask for course preference and omit
  course and course_name from every availability call.
- >-
  After eligibility succeeds, collect exact player count and nine or eighteen
  holes before availability. Do not ask riding or walking before availability.
- >-
  After the caller selects an exact returned slot, ask whether they will ride
  or walk, then pass the resulting riding boolean to book-tee-time-staging.
- >-
  For one player, present only returned slots whose spots_remaining is less
  than 4 so the caller joins an existing group.
- >-
  Gold Hills does not charge a SpeakSport booking fee. Quote returned
  base_price_per_player as the walking rate and
  base_price_per_player_riding as the riding rate. Do not add or describe a
  booking fee, and never invent a rate when a field is absent.
- >-
  Preserve each returned time, course, spots remaining, and pricing fields as
  one record. Pass the selected slot's exact returned course to booking.
cancellation_modification_policy: >-
  Gold Hills uses ForeUp. Booking references use the TTID_ prefix. The initial
  get-bookings lookup uses no parameters; a fallback lookup passes only the
  exact booking_reference and restores TTID_ when transcription clearly omitted
  it. Never speak a booking reference. The AI may cancel only when the tee time
  is at least 24 exact hours after the facility-local current date and time. If
  hours until tee off is less than 24, cancellation eligibility returns false.
  Exact reason: "I can only process cancellations for tee times that are at
  least 24 hours from now. The Pro Shop can help you with this cancellation."
  If hours until tee off is exactly 24 or greater, return eligible. Exact
  reason: "Eligible for cancellation." Apply no other cancellation criteria.
  Modifications and rescheduling must route to the Pro Shop. After a successful
  cancellation, explain that if a prepaid tee time is eligible for a refund,
  the Pro Shop can process it, and offer the transfer under the current
  hours-aware transfer flow.
walking_riding_cart_policies:
- Do not ask riding or walking before availability because it does not affect the search.
- Ask riding or walking only after the caller selects an exact slot and before booking.
- Pass riding as true for riding and false for walking.
