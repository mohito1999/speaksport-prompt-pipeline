booking_rules:
- Public players can book tee times up to seven calendar days in advance, inclusive of the current day (meaning the current day plus six future calendar days).
- Members can book tee times up to fourteen calendar days in advance, inclusive of the current day (meaning the current day plus thirteen future calendar days).
- Both nine-hole and eighteen-hole tee times are supported.
- This is a single-course facility; omit course and course_name filters from availability searches.
- When booking, preserve and pass the exact course returned with the selected availability slot.
