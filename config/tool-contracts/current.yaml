schema_version: "1"
version: "2026-09-03-booking-fees-all-providers"
status: owner_confirmed_foreup_club_prophet_clubcaddie_selective_booking_fees
tools:
  - capability: customer_record_lookup
    logical_name: get_customer_records
    compatible_modes: [integrated]
    required_arguments: {}
    optional_arguments:
      email:
        type: string
        format: email
        description: >-
          Caller-confirmed email used by itself for one fallback lookup only
          after the initial no-argument phone lookup returns no usable records.
      phone:
        type: string
        description: >-
          Caller-confirmed alternate phone number used by itself for one
          fallback lookup only after the initial no-argument phone lookup
          returns no usable records.
    result_fields:
      count:
        type: integer
        required: false
        description: Number of distinct matching Club Prophet customer records.
      records:
        type: array_of_customer_records
        required: false
        description: >-
          Every distinct match, without ranking. Each record contains
          customer_id, first_name, last_name, email, price_class, and is_member.
      status:
        type: string
        required: false
        allowed_values: [error]
      detail:
        type: string
        required: false
    preconditions:
      - facility tee_sheet is club_prophet
      - identity_confirmed is false
      - caller wants to book, asks about pricing, or asks about membership
      - announce the lookup to the caller before calling
      - first call is early with no arguments and never auto-selects a returned record
      - if the first call returns no usable records, ask whether the caller has played before
      - if the caller has played before, collect and confirm exactly one fallback identifier, email or alternate phone
      - second and final lookup passes only email or only phone
      - after a second empty result, or when the caller says they are new, continue as a new guest
      - a lookup error is spoken from detail and the caller flow continues without transfer
  - capability: identity_confirmation
    logical_name: confirm_identity
    compatible_modes: [integrated]
    required_arguments: {}
    optional_arguments:
      acct:
        type: string
        description: >-
          Exact customer_id of the record the caller confirmed. Links the caller
          immediately. Pass by itself after verbal confirmation.
    result_fields:
      status:
        type: string
        required: true
        allowed_values: [linked, needs_confirmation, not_found, error]
      customer:
        type: object
        required: false
        description: Confirmed customer returned when status is linked.
      acct:
        type: string
        required: false
        description: Candidate account returned by email lookup for later confirmation.
      first_name:
        type: string
        required: false
        description: Name to confirm aloud when status is needs_confirmation.
      detail:
        type: string
        required: false
    preconditions:
      - facility tee_sheet is club_prophet
      - acct is passed only after the caller confirms the matching profile or needs_confirmation name
      - confirm_identity is called with only acct after the caller verbally selects a record returned by get_customer_records
      - needs_confirmation requires an audible name confirmation before another call with acct
      - not_found continues as a guest
      - an error is spoken from detail and the caller flow continues without transfer
  - capability: eligibility
    logical_name: check-booking-eligibility-staging
    compatible_modes: [integrated]
    required_arguments:
      date: {type: string, format: YYYY-MM-DD}
      time: {type: string, format: "HH:MM"}
    optional_arguments:
      num_players:
        type: integer
        description: Pass before eligibility only when the facility eligibility policy evaluates player count.
      course_name:
        type: string
        description: Pass only when the facility eligibility policy requires an exact multi-course value.
    result_fields:
      eligible: {type: boolean, required: true}
      reason: {type: string, required: true}
    preconditions:
      - requested date and approximate time are known
      - player count is known before the call only when the facility eligibility policy evaluates num_players
      - holes, riding, identity, and inventory have not been requested
  - capability: availability
    logical_name: get-available-tee-times-staging
    compatible_modes: [integrated]
    required_arguments:
      date:
        type: string
        format: YYYY-MM-DD_or_MM-DD-YYYY
    optional_arguments:
      when:
        type: string
        format: HH:MM_preferred
        allowed_values: [morning, afternoon, evening, all, "HH:MM"]
        aliases: [time]
        description: >-
          Generated prompts must pass the caller's current exact 24-hour clock
          time when known. If the caller asks about a different exact time after
          seeing results, call availability again and replace when with that new
          exact time. Do not invent free-form windows.
      num_players:
        type: integer
        aliases: [players]
        description: >-
          Optional to the backend but mandatory in every generated receptionist
          availability call because player count changes usable inventory.
      num_holes:
        type: integer
        allowed_values: [9, 18]
        aliases: [holes]
        description: >-
          Optional to the backend with a default of 18, but mandatory in every
          generated receptionist availability call.
      course:
        type: string
        format: exact_courses_variable_value
        aliases: [course_name]
        description: Usually omitted for a single-course facility; required as a filter for the owner-approved multi-course flow.
    result_fields:
      results:
        type: array_of_rich_availability_records
        required: true
        description: >-
          The result is a list whose individual slot objects each contain
          time (caller-facing tee time), course (exact value to preserve for
          booking), and spots_remaining (integer bookable capacity). Pricing
          fields are optional by facility commercial model:
          base_price_per_player is the walking rate without a SpeakSport
          booking fee; base_price_per_player_riding is the riding rate without
          that fee; price_per_player is the walking rate including the fee;
          and price_per_player_riding is the riding rate including the fee.
          When the facility's SpeakSport booking-fee toggle is enabled, all
          four price fields are returned so the assistant can select the
          walking or riding rate with or without the fee for that caller. When
          the toggle is disabled, the provider may return its existing subset;
          when both corresponding base and non-base values are returned they
          are equal because no fee applies. Quote only fields actually returned
          and follow facility availability_pricing when choosing the caller's
          walking/riding and fee treatment. An empty list means no tee times are available for
          the requested date under the supplied holes and course criteria; it
          does not mean merely that nothing is close to when.
    preconditions:
      - eligibility succeeded
      - requested date and preferred time are known
      - caller explicitly provided number of players
      - caller explicitly selected 9 or 18 holes
      - every availability call passes num_players and num_holes
      - riding or walking is not collected before availability because it is not an availability argument
      - riding is collected after the caller selects a returned slot and before booking unless facility policy fixes the value
      - returned nearest-time results are not treated as exhaustive inventory
      - facility single-player presentation policy is applied to spots_remaining
      - an empty list is treated as no availability for the full requested date and supplied search criteria
      - a newly requested exact time triggers another call with that time as when while preserving the other search context
      - multi-course facilities have an exact course selected from the initialized courses variable
  - capability: booking
    logical_name: book-tee-time-staging
    compatible_modes: [integrated]
    required_arguments:
      course:
        type: string
        format: exact_selected_availability_course
        aliases: [course_name]
        description: Always pass the exact course associated with the selected slot; the backend permits omission only for a single-course default.
      date: {type: string, format: YYYY-MM-DD_or_MM-DD-YYYY}
      time: {type: string, format: "HH:MM"}
      num_players: {type: integer, aliases: [players]}
      num_holes: {type: integer, allowed_values: [9, 18], aliases: [holes]}
      first_name: {type: string}
      last_name: {type: string}
      email: {type: string, format: email}
    optional_arguments:
      riding: {type: boolean, description: Cart versus walk.}
      apply_booking_fee:
        type: boolean
        description: >-
          Supported for ForeUp, Club Prophet, and ClubCaddie. Pass true only
          when the configured facility booking-fee policy applies to this
          caller; otherwise pass false. This must agree with the fee-inclusive
          or base availability price quoted to the caller.
    result_fields:
      result: {type: string, required: true, allowed_values: [success]}
      booking_reference: {type: string_or_integer, required: false}
      amount_due: {type: number, required: false}
    preconditions:
      - caller selected an exact returned time and course pair
      - first name, last name, email, players, holes, and riding preference are known
      - returned 12-hour time has been converted to 24-hour HH:MM
      - apply_booking_fee is true or false according to facility availability_pricing and the caller's applicable class, passes, or groups
  - capability: booking_lookup
    logical_name: get-bookings
    compatible_modes: [integrated]
    required_arguments: {}
    optional_arguments:
      booking_reference:
        type: string
        description: >-
          Fallback after a phone-number search returns no bookings and the
          caller supplies a reference. ForeUp references use TTID_; Club
          Prophet and ClubCaddie references are numeric and must never gain a
          TTID_ prefix.
      date:
        type: string
        format: YYYY-MM-DD_or_MM-DD-YYYY
        description: >-
          Required with a ClubCaddie reference lookup unless the authoritative
          internal booking row already supplies its date. ForeUp and Club
          Prophet ignore this argument.
      course_name:
        type: string
        description: Optional provider course context; omit from normal fallback lookup.
    result_fields:
      status:
        type: string
        required: false
        allowed_values: [success, not_found, error]
      source: {type: string, required: false}
      bookings:
        type: array_of_booking_records
        required: true
        description: >-
          Zero or more records containing date, time, num_players, num_holes,
          course_name, hidden booking_reference, and optional provider detail.
          ClubCaddie cancelled entries may remain on its tee sheet and must be
          distinguished from a genuinely missing booking. Never speak the
          booking reference to the caller.
      detail: {type: string, required: false}
    preconditions:
      - initial lookup is called with no parameters so the tool uses the caller phone number automatically
      - ForeUp and Club Prophet fallback lookup passes only booking_reference
      - ClubCaddie fallback lookup passes booking_reference and date and omits course_name
      - ClubCaddie caller-phone lookup covers the next fourteen facility-local dates per configured course
  - capability: cancellation_eligibility
    logical_name: get-eligibility-for-cancellation
    compatible_modes: [integrated]
    required_arguments:
      date: {type: string, format: YYYY-MM-DD}
      time: {type: string, format: "HH:MM"}
    optional_arguments: {}
    result_fields:
      eligible: {type: boolean, required: true}
      reason: {type: string, required: false}
    preconditions:
      - get-bookings returned the selected reservation
      - caller identified the exact reservation to cancel
      - date and time come from that selected reservation
  - capability: cancellation
    logical_name: cancel-reservation
    compatible_modes: [integrated]
    required_arguments:
      booking_reference:
        type: string
        description: Exact internal reference associated with the caller-selected reservation returned by get-bookings.
    optional_arguments:
      date: {type: string, format: YYYY-MM-DD_or_MM-DD-YYYY}
      time: {type: string, format: "HH:MM_or_12_hour"}
      num_players: {type: integer}
      num_holes: {type: integer, allowed_values: [9, 18]}
      course_name: {type: string}
    result_fields:
      status:
        type: string
        required: true
        allowed_values: [success, not_found, gms_error, error]
        description: The assistant may confirm cancellation only when status is success.
      detail:
        type: string
        required: false
        description: Normalized caller-safe result detail; never expose raw provider errors.
    preconditions:
      - get-eligibility-for-cancellation returned eligible true
      - booking_reference is the exact hidden reference associated with the selected reservation
      - ForeUp and Club Prophet cancellation normally passes only booking_reference
      - ClubCaddie cancellation passes the selected reservation booking_reference, date, time, num_players, course_name, and num_holes when known
      - ClubCaddie cancellation may still be attempted with known reservation details when a provider lookup is temporarily unavailable
  - capability: sms
    logical_name: send_sms
    compatible_modes: [integrated, non_integrated]
    required_arguments:
      phone: {type: string}
      message: {type: string}
    optional_arguments: {}
    result_fields:
      success: {type: boolean, required: true}
    preconditions:
      - caller consented to receive the booking link
  - capability: transfer
    logical_name: transfer_call-staging
    compatible_modes: [integrated, non_integrated]
    required_arguments:
      destination: {type: string, format: exact_configured_identifier}
    optional_arguments: {}
    result_fields:
      success: {type: boolean, required: true}
    preconditions:
      - destination is configured in Vapi and facility intake with exactly matching spelling
      - current_status, opening_time, and closing_time are initialized
      - when current_status is after_hours, follow transfer_policy.allow_after_hours_transfers; false prohibits the tool, while true permits the transfer after explaining the closed team and possible voicemail
      - current_status governs only transfer_call-staging and never blocks or changes any enabled non-transfer tool or self-service workflow
      - booking, availability, identity, eligibility, existing-booking lookup, cancellation, weather, SMS, and other enabled non-transfer actions remain available 24 hours a day, 7 days a week
      - a caller's explicit direct transfer request is itself consent and must not be reconfirmed
      - when the assistant offers a transfer without a direct caller request it waits for affirmative consent
      - the optional first-shop-transfer deflection asks whether the assistant can help first and never claims the shop is busy
  - capability: day_of_week
    logical_name: get-day-of-week-staging
    compatible_modes: [integrated]
    required_arguments: {}
    optional_arguments:
      date:
        type: string
        format: YYYY-MM-DD
        description: >-
          Pass by itself when the caller gives a calendar date. Pass together
          with day_of_week when the caller states both a calendar date and a
          weekday so the backend can validate the pair.
      day_of_week:
        type: string
        allowed_values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        description: >-
          Pass by itself when the caller gives only a weekday. The tool returns
          the next four matching facility-local dates. Pass together with date
          when the caller states both values.
    result_fields:
      status:
        type: string
        required: false
        allowed_values: [success]
      date:
        type: string
        required: false
        description: Resolved or validated calendar date when applicable.
      readable:
        type: string
        required: false
        description: Facility-local caller-readable date returned for date-only or matching-pair calls.
      day_of_week:
        type: string
        required: false
        description: Resolved weekday for date-only calls, or requested weekday for weekday-only calls.
      resolved_day_of_week:
        type: string
        required: false
        description: Actual weekday for the supplied date when both date and day_of_week are passed.
      provided_day_of_week:
        type: string
        required: false
        description: Caller-provided weekday echoed when both inputs are passed.
      matches:
        type: boolean
        required: false
        description: Whether a supplied calendar date and caller-stated weekday agree.
      upcoming_dates:
        type: array_of_date_readable_records
        required: false
        description: >-
          The next four facility-local dates matching a weekday-only request;
          each record contains date and readable.
    preconditions:
      - at least one of date or day_of_week is supplied
      - date-only calls resolve the actual weekday and return readable
      - weekday-only calls return the next four facility-local matching dates
      - calls with both date and day_of_week validate the caller-stated pair
      - when matches is false, clarification is mandatory before inventory warm-up, eligibility, availability, or booking
  - capability: inventory_warmup
    logical_name: fetch-inventory-for-date
    compatible_modes: [integrated]
    required_arguments:
      date: {type: string, format: MM-DD-YYYY}
    optional_arguments: {}
    result_fields:
      success: {type: boolean, required: false}
    preconditions:
      - facility reference flow enables inventory warm-up
  - capability: weather
    logical_name: get-weather-forecast-staging
    compatible_modes: [integrated, non_integrated]
    required_arguments:
      date: {type: string, format: MM-DD-YYYY}
    optional_arguments:
      granularity: {type: string, allowed_values: [daily, hourly]}
    result_fields:
      forecast: {type: object, required: true}
    preconditions:
      - caller asked about weather for a known date
