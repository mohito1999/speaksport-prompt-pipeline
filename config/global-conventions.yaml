schema_version: "1"
status: owner_confirmed
prompt_architecture:
  section_order:
    - core-shell
    - knowledge-base
    - logic-module
    - core-shell
  knowledge_base_embedded: true
  allow_multiple_core_shells: true
transfer_protocol:
  status: owner_confirmed_2026_09_02_after_hours_transfer_is_facility_configured
  integrated:
    caller_direct_request_is_consent: true
    do_not_reconfirm_direct_request: true
    assistant_offered_transfer_requires_later_affirmative_consent: true
    first_general_golf_shop_request_uses_deflection: facility_configured
    default_first_shop_transfer_deflection: false
    automatic_transfer_exceptions:
      - booking tool failure after attempted booking
      - post-booking profile email update already explained to caller
      - general tool failure when the reference flow explicitly requires golf shop recovery
  non_integrated:
    caller_direct_request_is_consent: true
    do_not_reconfirm_direct_request: true
    assistant_offered_transfer_requires_later_affirmative_consent: true
    transfer_transition_and_tool_call_must_share_response: true
    first_general_golf_shop_request_uses_deflection: facility_configured
    default_first_shop_transfer_deflection: false
  all_modes:
    destination_identifier_must_match_vapi_configuration: true
    runtime_hours_variables: [current_status, opening_time, closing_time]
    after_hours_value: after_hours
    after_hours_transfer_configuration:
      config_path: transfer_policy.allow_after_hours_transfers
      default: false
    after_hours_behavior:
      when_transfers_disabled:
        transfer_tool_prohibited: true
        tell_caller_department_is_closed: true
        offer_assistant_help: true
        tell_caller_to_call_back_at_opening_time: true
      when_transfers_enabled:
        transfer_tool_prohibited: false
        tell_caller_department_is_closed: true
        explain_transfer_may_reach_voicemail: true
        continue_normal_transfer_consent_protocol: true
      assistant_self_service_operates_24_7: true
      enabled_non_transfer_tools_remain_available: true
      do_not_stop_or_change_booking_flow: true
      do_not_treat_as_booking_restriction_or_tool_failure: true
      unaffected_capabilities:
        - booking
        - availability
        - identity resolution
        - booking eligibility
        - existing-booking lookup
        - cancellation
        - weather
        - SMS
    optional_shop_deflection:
      wording: "Is there something I can assist you with first?"
      prohibit_busy_shop_claim: true
      caller_declines_or_repeats_request_means_transfer_now: true
phone_numbers_in_prompts:
  status: owner_confirmed
  allowed: false
club_prophet_on_call_identity:
  status: owner_confirmed_2026_08_20_with_fallback_lookup
  configuration_path: tee_sheet
  enabled_value: club_prophet
  gate_variable: identity_confirmed
  tools:
    lookup: get_customer_records
    confirm: confirm_identity
  trigger_intents:
    - booking
    - pricing
    - membership
  lookup:
    call_when_identity_confirmed_false: true
    call_once_early: true
    announce_before_call: true
    initial_arguments: none
    zero_records:
      tell_caller_no_records_found_under_current_phone: true
      ask_whether_caller_has_played_before: true
      caller_says_no_or_no_existing_record: continue_as_new_guest
      caller_says_yes:
        collect_exactly_one_of: [email, alternate_phone]
        confirm_collected_identifier_before_lookup: true
        email_uses_phonetic_readback: true
        fallback_call_tool: get_customer_records
        fallback_call_passes_only_collected_identifier: true
        maximum_fallback_calls: 1
        second_empty_result: explain_and_continue_as_new_guest
    one_record: caller_confirmation_required
    multiple_records: caller_selects_without_assistant_ranking
    distinguishing_email_content: ending_or_domain_only
    never_speak_full_email: true
    failure: speak_detail_and_continue_without_transfer
  confirmation:
    selected_record_argument: acct
    selected_record_value: exact_customer_id
    no_candidate_matches:
      use_same_single_fallback_lookup_as_zero_records: true
    confirm_identity_lookup_arguments_prohibited: [email, phone]
    linked_status_means_identity_confirmed_for_remainder_of_call: true
    not_found: continue_as_guest
    failure: speak_detail_and_continue_without_transfer
  privacy_and_safety:
    never_auto_select: true
    never_prefer_member_record: true
    never_use_phone_recognized_or_caller_is_customer_as_gate: true
    prohibit_profile_dependent_price_membership_or_booking_window_before_confirmation: true
booking:
  pass_returned_course_for_single_course:
    status: owner_confirmed
    value: true
  multi_course:
    ask_for_course_first: true
    course_source_variable: courses
    availability_filter_argument: course_name
    booking_course_must_match_selected_availability_slot: true
availability_when:
  status: owner_confirmed_2026_07_31
  backend_accepted_values:
    - morning
    - afternoon
    - evening
    - all
    - HH:MM
  generated_prompt_preference: HH:MM
  allow_arbitrary_natural_language: false
  required_context:
    - date
    - num_players
    - num_holes
  nearest_results_are_exhaustive: false
  exact_time_requery:
    required_when_caller_requests_new_exact_time: true
    replace_when_with_new_exact_hh_mm: true
    preserve_date: true
    preserve_num_players: true
    preserve_num_holes: true
    preserve_course_filter_or_omission: true
    prohibit_unavailable_claim_before_requery: true
    prohibit_web_discrepancy_claim_before_requery: true
  result_fields:
    - time
    - course
    - spots_remaining
    - base_price_per_player
    - base_price_per_player_riding
    - price_per_player
    - price_per_player_riding
  price_quoting:
    quote_when_caller_asks: true
    configuration_path: availability_pricing
    base_price_per_player: walking_without_booking_fee
    base_price_per_player_riding: riding_without_booking_fee
    price_per_player: walking_with_booking_fee
    price_per_player_riding: riding_with_booking_fee
    never_invent_missing_field: true
    fee_application_values: [none, all_callers, conditional]
    conditional_fee_inputs: [price_class, customer_passes, customer_groups]
    disclosure_is_facility_configured: true
    booking_fee_toggle_on_returns_all_four_price_fields: true
    booking_fee_toggle_off_does_not_require_all_four_price_fields: true
    equal_base_and_non_base_values_mean_no_fee_difference: true
    riding_only_facility_ignores_walking_fields: true
    booking_argument: apply_booking_fee
    supported_providers: [foreup, club_prophet, club_caddie]
    pass_true_only_when_fee_applies_to_caller: true
    pass_false_when_fee_does_not_apply: true
  riding_collection:
    availability_argument: false
    ask_before_availability: false
    ask_after_exact_slot_selection: true
    ask_before_booking: true
    fixed_facility_policy_overrides_question: true
  empty_result:
    means_no_times_for_full_requested_date: true
    scoped_to_requested_num_holes_and_course_filter: true
    offer_alternate_date: true
    offer_alternate_holes_only_when_facility_supports_them: true
    offer_alternate_course_only_for_multi_course_facilities: true
  single_player_filter:
    facility_configured: true
    configuration_path: availability_policy.single_player_requires_partially_filled_slot
    restricted_rule: present_only_slots_with_spots_remaining_below_four
    default: false
date_time_context:
  status: owner_confirmed_2026_07_27
  current_date_and_time_required: true
  date_format: "%A, %B %d, %Y"
  time_format: "%I:%M %p"
  timezone_source: facility_configured_iana_timezone
  sentence_template: >-
    Today is {{"now" | date: "%A, %B %d, %Y", "<facility timezone>"}},
    and the current time is {{"now" | date: "%I:%M %p", "<facility timezone>"}}.
date_resolution:
  status: owner_confirmed_2026_08_21
  universal_for_integrated_gms: true
  tool: get-day-of-week-staging
  at_least_one_input_required: [date, day_of_week]
  date_only:
    pass_only: date
    use_returned_fields: [day_of_week, readable]
  weekday_only:
    pass_only: day_of_week
    returned_candidates: next_four_facility_local_dates
    caller_must_select_an_exact_returned_date: true
  stated_date_and_weekday:
    pass_together: [date, day_of_week]
    validate_matches: true
    resolved_weekday_field_preference: [resolved_day_of_week, day_of_week]
  mismatch:
    hard_stop: true
    explain_conflict_and_ask_which_the_caller_meant: true
    prohibited_before_clarification:
      - fetch-inventory-for-date
      - check-booking-eligibility-staging
      - get-available-tee-times-staging
      - book-tee-time-staging
  readable_is_authoritative_for_speech: true
  assistant_calendar_guessing_prohibited: true
existing_bookings:
  status: owner_confirmed_2026_07_22
  initial_lookup:
    tool: get-bookings
    arguments: none
    identity_source: caller_phone_automatically_resolved_by_tool
  fallback_lookup:
    argument: booking_reference
    pass_only_booking_reference: true
    pass_course_name: false
    foreup_reference_prefix: TTID_
  provider_rules:
    foreup:
      reference_format: TTID_prefixed
      fallback_arguments: [booking_reference]
    club_prophet:
      reference_format: numeric
      fallback_arguments: [booking_reference]
      identity_resolution_required_when_identity_confirmed_is_false: true
    club_caddie:
      reference_format: short_numeric_string
      fallback_arguments: [booking_reference, date]
      date_required_without_authoritative_internal_booking_row: true
      phone_lookup_horizon_days: 14
      cancelled_records_remain_on_provider_tee_sheet: true
      distinguish_already_cancelled_from_not_found: true
      identity_resolution_tools_prohibited: [get_customer_records, confirm_identity]
  spoken_results:
    fields: [date, time, num_players, course_name]
    never_speak_booking_reference: true
  empty_result:
    ask_for_booking_reference_before_transfer: true
    transfer_uses_standard_two_step_protocol: true
cancellations:
  status: owner_confirmed_2026_07_22
  required_tools: [get-bookings, get-eligibility-for-cancellation, cancel-reservation]
  preserve_hidden_reference_from_lookup: true
  caller_selects_exact_booking_before_eligibility: true
  eligibility_arguments: [date, time]
  ineligible_behavior:
    speak_exact_reason: true
    transfer_uses_standard_two_step_protocol: true
  eligible_behavior:
    cancel_immediately_without_reconfirming: true
    cancellation_argument: booking_reference
    confirm_only_after_success: true
  provider_rules:
    foreup:
      cancellation_arguments: [booking_reference]
    club_prophet:
      cancellation_arguments: [booking_reference]
    club_caddie:
      cancellation_arguments:
        - booking_reference
        - date
        - time
        - num_players
        - num_holes_when_known
        - course_name
      success_field: status
      success_value: success
      failure_values: [not_found, gms_error, error]
      attempt_with_known_details_when_lookup_unavailable: true
      booking_confirmation_email_supported: false
      speaksport_booking_fee_supported: true
      availability_spots_remaining_semantics: largest_bookable_party_size
  modifications_and_rescheduling_remain_transfer_only: true
human_approval_required: true
